</tspan></text>
<text x="10" y="328"><tspan fill="#928374">15</tspan></text>
<text x="60" y="328" xml:space="preserve"><tspan >Cook </tspan><tspan fill="#f76565">@rice</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">200</tspan><tspan fill="#ffffff" font-weight="bold">%</tspan><tspan fill="#d79921">g</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan > according to </tspan><tspan font-style="italic" fill="#928374">[- todo: add garlic rice recipe -]</tspan><tspan > package directions.
</tspan></text>
<text x="10" y="350"><tspan fill="#928374">16</tspan></text>
<text x="60" y="350" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="372"><tspan fill="#928374">17</tspan></text>
<text x="60" y="372" xml:space="preserve"><tspan >Sauté </tspan><tspan fill="#f76565">@onion</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">1</tspan><tspan fill="#ffffff" font-weight="bold">/</tspan><tspan fill="#02cc83" font-weight="bold">2</tspan><tspan fill="#ffffff" font-weight="bold">}(</tspan><tspan fill="#00c080">diced</tspan><tspan fill="#ffffff" font-weight="bold">)</tspan><tspan > and </tspan><tspan fill="#f76565">@garlic</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">2</tspan><tspan fill="#ffffff" font-weight="bold">-</tspan><tspan fill="#02cc83" font-weight="bold">3</tspan><tspan fill="#f76565"> </tspan><tspan fill="#d79921">cloves</tspan><tspan fill="#ffffff" font-weight="bold">}(</tspan><tspan fill="#00c080">minced</tspan><tspan fill="#ffffff" font-weight="bold">)</tspan><tspan > in </tspan><tspan fill="#f76565">@olive oil</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">2</tspan><tspan fill="#ffffff" font-weight="bold">%</tspan><tspan fill="#d79921">tbsp</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan >
</tspan></text>
<text x="10" y="394"><tspan fill="#928374">18</tspan></text>
<text x="60" y="394" xml:space="preserve"><tspan >in a </tspan><tspan fill="#ddb700">#large skillet</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan > until softened, about </tspan><tspan font-weight="bold" fill="#0a92fa">~fry</tspan><tspan font-weight="bold" fill="#ffffff">{</tspan><tspan font-weight="bold" fill="#02cc83">5</tspan><tspan font-weight="bold" fill="#0a92fa"> </tspan><tspan font-weight="bold" fill="#d65d0e">minutes</tspan><tspan font-weight="bold" fill="#ffffff">}</tspan><tspan >.
</tspan></text>
<text x="10" y="416"><tspan fill="#928374">19</tspan></text>
<text x="60" y="416" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="438"><tspan fill="#928374">20</tspan></text>
<text x="60" y="438" xml:space="preserve"><tspan >Add </tspan><tspan fill="#f76565">@canned tomatoes</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">400</tspan><tspan fill="#ffffff" font-weight="bold">%</tspan><tspan fill="#d79921">g</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan >, </tspan><tspan fill="#f76565">@black beans</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">240</tspan><tspan fill="#ffffff" font-weight="bold">%</tspan><tspan fill="#d79921">g</tspan><tspan fill="#ffffff" font-weight="bold">}(</tspan><tspan fill="#00c080">drained</tspan><tspan fill="#ffffff" font-weight="bold">)</tspan><tspan >,
</tspan></text>
<text x="10" y="460"><tspan fill="#928374">21</tspan></text>
<text x="60" y="460" xml:space="preserve"><tspan fill="#f76565">@cumin</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">1</tspan><tspan fill="#ffffff" font-weight="bold">%</tspan><tspan fill="#d79921">tsp</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan >, and </tspan><tspan fill="#f76565">@smoked paprika</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">1</tspan><tspan fill="#ffffff" font-weight="bold">%</tspan><tspan fill="#d79921">tsp</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan >. Stir in the </tspan><tspan fill="#f76565">@</tspan><tspan fill="#d79921" font-weight="bold">&amp;</tspan><tspan fill="#ffffff" font-weight="bold">(</tspan><tspan fill="#02cc83" font-weight="bold">1</tspan><tspan fill="#ffffff" font-weight="bold">)</tspan><tspan fill="#f76565">cooked rice</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan >.
</tspan></text>
<text x="10" y="482"><tspan fill="#928374">22</tspan></text>
<text x="60" y="482" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="504"><tspan fill="#928374">23</tspan></text>
<text x="60" y="504" xml:space="preserve"><tspan font-weight="bold" fill="#ffffff">= Assembly</tspan><tspan >
</tspan></text>
<text x="10" y="526"><tspan fill="#928374">24</tspan></text>
<text x="60" y="526" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="548"><tspan fill="#928374">25</tspan></text>
<text x="60" y="548" xml:space="preserve"><tspan font-style="italic" fill="#928374">-- perhaps add sauce section here later?</tspan><tspan >
</tspan></text>
<text x="10" y="570"><tspan fill="#928374">26</tspan></text>
<text x="60" y="570" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="592"><tspan fill="#928374">27</tspan></text>
<text x="60" y="592" xml:space="preserve"><tspan >Cut the tops off </tspan><tspan fill="#f76565">@peppers</tspan><tspan fill="#ffffff" font-weight="bold">|</tspan><tspan fill="#f76565">capsicum</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">4</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan > and remove seeds.
</tspan></text>
<text x="10" y="614"><tspan fill="#928374">28</tspan></text>
<text x="60" y="614" xml:space="preserve"><tspan >Stuff with the </tspan><tspan fill="#f76565">@</tspan><tspan fill="#d79921" font-weight="bold">&amp;</tspan><tspan fill="#ffffff" font-weight="bold">(</tspan><tspan fill="#f76565">=</tspan><tspan fill="#02cc83" font-weight="bold">1</tspan><tspan fill="#ffffff" font-weight="bold">)</tspan><tspan fill="#f76565">filling</tspan><tspan > and place in a </tspan><tspan fill="#ddb700">#baking dish</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan >.
</tspan></text>
<text x="10" y="636"><tspan fill="#928374">29</tspan></text>
<text x="60" y="636" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="658"><tspan fill="#928374">30</tspan></text>
<text x="60" y="658" xml:space="preserve"><tspan font-style="italic" fill="#f765eb" font-weight="bold">&gt; </tspan><tspan font-style="italic" fill="#f765eb">An aged cheddar is recommended.</tspan><tspan >
</tspan></text>
<text x="10" y="680"><tspan fill="#928374">31</tspan></text>
<text x="60" y="680" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="702"><tspan fill="#928374">32</tspan></text>
<text x="60" y="702" xml:space="preserve"><tspan >Top each pepper with </tspan><tspan fill="#f76565">@cheese</tspan><tspan fill="#ffffff" font-weight="bold">|</tspan><tspan fill="#f76565">cheddar</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">100</tspan><tspan fill="#ffffff" font-weight="bold">%</tspan><tspan fill="#d79921">g</tspan><tspan fill="#ffffff" font-weight="bold">}(</tspan><tspan fill="#00c080">grated</tspan><tspan fill="#ffffff" font-weight="bold">)</tspan><tspan > and optionally </tspan><tspan fill="#f76565">@</tspan><tspan fill="#d79921" font-weight="bold">?</tspan><tspan fill="#f76565">pecorino</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">50</tspan><tspan fill="#ffffff" font-weight="bold">%</tspan><tspan fill="#d79921">g</tspan><tspan fill="#ffffff" font-weight="bold">}(</tspan><tspan fill="#00c080">shaved</tspan><tspan fill="#ffffff" font-weight="bold">)</tspan><tspan >.
</tspan></text>
<text x="10" y="724"><tspan fill="#928374">33</tspan></text>
<text x="60" y="724" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="746"><tspan fill="#928374">34</tspan></text>
<text x="60" y="746" xml:space="preserve"><tspan >Bake in a preheated </tspan><tspan fill="#ddb700">#oven</tspan><tspan > at </tspan><tspan font-weight="bold" fill="#02cc83">190</tspan><tspan font-weight="bold" fill="#02cc83">°C</tspan><tspan > for </tspan><tspan font-weight="bold" fill="#0a92fa">~</tspan><tspan font-weight="bold" fill="#ffffff">{</tspan><tspan font-weight="bold" fill="#02cc83">30</tspan><tspan font-weight="bold" fill="#0a92fa"> </tspan><tspan font-weight="bold" fill="#d65d0e">minutes</tspan><tspan font-weight="bold" fill="#ffffff">}</tspan><tspan > until </tspan><tspan fill="#f76565">@</tspan><tspan fill="#d79921" font-weight="bold">&amp;</tspan><tspan fill="#f76565">peppers</tspan><tspan >.
</tspan></text>
<text x="10" y="768"><tspan fill="#928374">35</tspan></text>
<text x="60" y="768" xml:space="preserve"><tspan >are tender and </tspan><tspan fill="#f76565">@</tspan><tspan fill="#d79921" font-weight="bold">&amp;</tspan><tspan fill="#f76565">cheese</tspan><tspan > is bubbling.
</tspan></text>
<text x="10" y="790"><tspan fill="#928374">36</tspan></text>
<text x="60" y="790" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="812"><tspan fill="#928374">37</tspan></text>
<text x="60" y="812" xml:space="preserve"><tspan >Serve with </tspan><tspan fill="#f76565">@</tspan><tspan fill="#d79921" font-weight="bold">@</tspan><tspan fill="#f76565">./Sauces/Salsa Verde</tspan><tspan fill="#ffffff" font-weight="bold">{</tspan><tspan fill="#02cc83" font-weight="bold">1</tspan><tspan fill="#ffffff" font-weight="bold">-</tspan><tspan fill="#dc8b3f">1.5</tspan><tspan fill="#f76565"> </tspan><tspan fill="#d79921">servings</tspan><tspan fill="#ffffff" font-weight="bold">}</tspan><tspan >. </tspan><tspan font-style="italic" fill="#928374">-- todo</tspan><tspan >
</tspan></text>
