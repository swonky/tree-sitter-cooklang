</tspan></text>
<text x="10" y="240"><tspan fill="#928374">11</tspan></text>
<text x="60" y="240" xml:space="preserve"><tspan font-style="italic" fill="#f765eb" font-weight="bold">&gt; </tspan><tspan font-style="italic" fill="#f765eb">These freeze well. Double the batch and freeze half for a quick weeknight dinner.</tspan><tspan >
</tspan></text>
<text x="10" y="262"><tspan fill="#928374">12</tspan></text>
<text x="60" y="262" xml:space="preserve"><tspan >
</tspan></text>
<text x="10" y="284"><tspan fill="#928374">13</tspan></text>
<text x="60" y="284" xml:space="preserve"><tspan font-weight="bold" fill="#ffffff">= Filling</tspan><tspan >
</tspan></text>
<text x="10" y="306"><tspan fill="#928374">14</tspan></text>
