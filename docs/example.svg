</tspan></text>
<text x="10" y="196"><tspan fill="#928374">9</tspan></text>
<text x="60" y="196" xml:space="preserve"><tspan fill="#cc241d" font-weight="bold">&gt;&gt;</tspan><tspan fill="#d79921"> </tspan><tspan fill="#ffffff" font-weight="bold">[</tspan><tspan fill="#cc241d" font-weight="bold">mode</tspan><tspan fill="#ffffff" font-weight="bold">]</tspan><tspan fill="#ffffff" font-weight="bold">:</tspan><tspan fill="#00c080"> all</tspan><tspan >
